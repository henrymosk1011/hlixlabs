<body class="planner-embed" data-page="planner">
<section class="planner" data-planner data-embed>
    <fieldset class="step pl-vials" data-reveal>
      <legend><span class="step__t">your vials</span><b class="step__e" data-pl-echo>5 mg</b></legend>
      <div class="pl-tabs" data-pl-tabs></div>
      <div class="pl-set">
        <label class="pl-name"><span class="pl-k">name</span><input type="text" data-pl-name maxlength="28" placeholder="e.g. BPC-157" list="pl-names" autocomplete="off" spellcheck="false"></label>
        <div class="pl-color"><span class="pl-k">color</span><div class="pl-swatches" data-pl-colors><button type="button" class="pl-sw" data-c="0" data-color="0" aria-label="green"></button><button type="button" class="pl-sw" data-c="1" data-color="1" aria-label="blue"></button><button type="button" class="pl-sw" data-c="2" data-color="2" aria-label="violet"></button><button type="button" class="pl-sw" data-c="3" data-color="3" aria-label="pink"></button><button type="button" class="pl-sw" data-c="4" data-color="4" aria-label="lime"></button><button type="button" class="pl-sw" data-c="5" data-color="5" aria-label="silver"></button><label class="pl-sw pl-sw--custom" aria-label="custom color"><input type="color" data-pl-custom value="#33e6b0"></label></div></div>
        <div class="pl-size"><span class="pl-k">size</span><div class="opts" data-pl-vial><button type="button" class="opt" data-val="2">2 mg</button><button type="button" class="opt is-active" data-val="5">5 mg</button><button type="button" class="opt" data-val="10">10 mg</button><button type="button" class="opt" data-val="20">20 mg</button><button type="button" class="opt" data-val="30">30 mg</button><button type="button" class="opt" data-val="50">50 mg</button><button type="button" class="opt" data-val="100">100 mg</button><button type="button" class="opt" data-val="custom">custom</button><input class="opt-in" type="number" inputmode="decimal" min="0" step="any" placeholder="mg" hidden></div></div>
        <button type="button" class="pl-remove" data-pl-remove hidden>remove vial</button>
      </div>
      <datalist id="pl-names"></datalist>
    </fieldset>
    <div class="planner__body">
      <div class="cal" data-cal data-reveal>
        <div class="cal__head">
          <h3 class="cal__month" data-cal-title>&nbsp;</h3>
          <div class="cal__nav"><button type="button" class="cal__btn" data-cal-nav="-1" aria-label="previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><button type="button" class="cal__btn cal__today" data-cal-today>today</button><button type="button" class="cal__btn" data-cal-nav="1" aria-label="next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></div>
        </div>
        <div class="cal__dow" aria-hidden="true"><span>sun</span><span>mon</span><span>tue</span><span>wed</span><span>thu</span><span>fri</span><span>sat</span></div>
        <div class="cal__grid" data-cal-grid></div>
        <div class="cal__foot"><span data-cal-sum>&nbsp;</span><button type="button" class="cal__clear" data-cal-clear hidden>clear plan</button></div>
        <div class="cal__ed" data-cal-ed hidden><div class="cal__ed-in"><div class="cal__ed-box" role="group" aria-label="dose for this day">
          <div class="ed__head"><b data-ed-date></b><span class="ed__meta" data-ed-meta></span><button type="button" class="ed__x" data-ed-close aria-label="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
          <div class="ed__row" data-ed-vial-row hidden><span class="ed__k">vial</span><div class="opts" data-ed-vials></div></div>
          <div class="ed__row"><span class="ed__k">dose</span><div class="opts" data-ed-dose><button type="button" class="opt" data-val="0.25">0.25 mg</button><button type="button" class="opt" data-val="0.5">0.5 mg</button><button type="button" class="opt" data-val="1">1 mg</button><button type="button" class="opt" data-val="2">2 mg</button><button type="button" class="opt" data-val="2.5">2.5 mg</button><button type="button" class="opt" data-val="5">5 mg</button><button type="button" class="opt" data-val="10">10 mg</button><button type="button" class="opt" data-val="custom">custom</button><input class="opt-in" type="number" inputmode="decimal" min="0" step="any" placeholder="mg" hidden><button type="button" class="opt" data-val="0">none</button></div></div>
          <div class="ed__row"><span class="ed__k">repeat</span><div class="opts" data-ed-rep><button type="button" class="opt is-active" data-val="0">just this day</button><button type="button" class="opt" data-val="1">daily</button><button type="button" class="opt" data-val="2">every other day</button><button type="button" class="opt" data-val="7">weekly</button></div></div>
          <p class="ed__hint" data-ed-hint hidden></p>
        </div></div></div>
      </div>
      <aside class="pl-out" data-reveal="fade">
        <div class="pl-out__head"><p class="out__k">left in vial</p><b data-pl-size>vial 1 · 5 mg</b></div>
        <div class="pl-tiles"><div class="pl-t" data-pl-t="day"><p class="pl-t__k">day</p><p class="pl-t__d" data-pl-d>&nbsp;</p><div class="mv"><svg viewBox="0 0 40 84" aria-hidden="true">
  <defs>
    <clipPath id="mv-day-clip"><rect x="5.5" y="18.5" width="29" height="63" rx="6.5"/></clipPath>
    <linearGradient id="mv-day-liq" x1="0" y1="0" x2="0" y2="1"><stop class="mv__s1" offset="0"/><stop class="mv__s2" offset="1"/></linearGradient>
  </defs>
  <rect class="mv__cap" x="10.5" y="2.5" width="19" height="10" rx="2.5"/>
  <rect class="mv__neck" x="13.5" y="12.5" width="13" height="6" rx="1"/>
  <g clip-path="url(#mv-day-clip)"><g class="mv__liq"><rect x="4" y="18" width="32" height="66" fill="url(#mv-day-liq)"/><rect class="mv__men" x="4" y="18" width="32" height="1.6"/></g></g>
  <rect class="mv__body" x="5.5" y="18.5" width="29" height="63" rx="6.5"/>
  <g class="mv__ticks"><line x1="31" y1="34" x2="35" y2="34"/><line x1="29" y1="50" x2="35" y2="50"/><line x1="31" y1="66" x2="35" y2="66"/></g>
</svg></div><p class="pl-t__v"><b data-pl-v>5</b><small>mg</small></p><p class="pl-t__u" data-pl-u>nothing used</p></div><div class="pl-t" data-pl-t="week"><p class="pl-t__k">week</p><p class="pl-t__d" data-pl-d>&nbsp;</p><div class="mv"><svg viewBox="0 0 40 84" aria-hidden="true">
  <defs>
    <clipPath id="mv-week-clip"><rect x="5.5" y="18.5" width="29" height="63" rx="6.5"/></clipPath>
    <linearGradient id="mv-week-liq" x1="0" y1="0" x2="0" y2="1"><stop class="mv__s1" offset="0"/><stop class="mv__s2" offset="1"/></linearGradient>
  </defs>
  <rect class="mv__cap" x="10.5" y="2.5" width="19" height="10" rx="2.5"/>
  <rect class="mv__neck" x="13.5" y="12.5" width="13" height="6" rx="1"/>
  <g clip-path="url(#mv-week-clip)"><g class="mv__liq"><rect x="4" y="18" width="32" height="66" fill="url(#mv-week-liq)"/><rect class="mv__men" x="4" y="18" width="32" height="1.6"/></g></g>
  <rect class="mv__body" x="5.5" y="18.5" width="29" height="63" rx="6.5"/>
  <g class="mv__ticks"><line x1="31" y1="34" x2="35" y2="34"/><line x1="29" y1="50" x2="35" y2="50"/><line x1="31" y1="66" x2="35" y2="66"/></g>
</svg></div><p class="pl-t__v"><b data-pl-v>5</b><small>mg</small></p><p class="pl-t__u" data-pl-u>nothing used</p></div><div class="pl-t" data-pl-t="month"><p class="pl-t__k">month</p><p class="pl-t__d" data-pl-d>&nbsp;</p><div class="mv"><svg viewBox="0 0 40 84" aria-hidden="true">
  <defs>
    <clipPath id="mv-month-clip"><rect x="5.5" y="18.5" width="29" height="63" rx="6.5"/></clipPath>
    <linearGradient id="mv-month-liq" x1="0" y1="0" x2="0" y2="1"><stop class="mv__s1" offset="0"/><stop class="mv__s2" offset="1"/></linearGradient>
  </defs>
  <rect class="mv__cap" x="10.5" y="2.5" width="19" height="10" rx="2.5"/>
  <rect class="mv__neck" x="13.5" y="12.5" width="13" height="6" rx="1"/>
  <g clip-path="url(#mv-month-clip)"><g class="mv__liq"><rect x="4" y="18" width="32" height="66" fill="url(#mv-month-liq)"/><rect class="mv__men" x="4" y="18" width="32" height="1.6"/></g></g>
  <rect class="mv__body" x="5.5" y="18.5" width="29" height="63" rx="6.5"/>
  <g class="mv__ticks"><line x1="31" y1="34" x2="35" y2="34"/><line x1="29" y1="50" x2="35" y2="50"/><line x1="31" y1="66" x2="35" y2="66"/></g>
</svg></div><p class="pl-t__v"><b data-pl-v>5</b><small>mg</small></p><p class="pl-t__u" data-pl-u>nothing used</p></div></div>
        <dl class="rows pl-rows">
          <div><dt data-pl-out-k>runs dry</dt><dd data-pl-out>—</dd></div>
          <div><dt>planned</dt><dd data-pl-plan>no doses yet</dd></div>
        </dl>
        <p class="warn" data-pl-warn hidden></p>
        <div class="pl-all" data-pl-all hidden><p class="out__k">all vials · <span data-pl-all-day></span></p><div data-pl-all-list></div></div>
      </aside>
    </div>
  </section>
