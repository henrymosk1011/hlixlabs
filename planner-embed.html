<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Dose planner · hlix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/planner.css?v=1794300261">
<script src="assets/js/v2-boot-embed.js?v=1794300261"></script>
</head>
<body class="pc-page">
<div class="pc" data-planner data-embed>

  <section class="pc-card pc-vials" aria-labelledby="pc-vials-h">
    <header class="pc-head">
      <div><h2 class="pc-h" id="pc-vials-h">Vials</h2><p class="pc-sub">Left <span data-pl-all-day>after today</span></p></div>
      <b class="pc-hidden" data-pl-echo></b>
    </header>
    <div class="pl-tabs pc-list" data-pl-tabs></div>
    <div class="pl-new pc-new" data-pl-new role="group" aria-label="New vial" hidden>
      <p class="pc-new__t">New vial</p>
      <label class="pc-field"><span class="pc-label">Name</span><input type="text" class="pc-input" data-new-name maxlength="28" placeholder="e.g. BPC-157 #2" list="pl-names" autocomplete="off" spellcheck="false"></label>
      <div class="pc-field"><span class="pc-label">Size</span><div class="opts" data-new-size><button type="button" class="opt" data-val="2">2 mg</button><button type="button" class="opt" data-val="5">5 mg</button><button type="button" class="opt" data-val="10">10 mg</button><button type="button" class="opt" data-val="15">15 mg</button><button type="button" class="opt" data-val="20">20 mg</button><button type="button" class="opt" data-val="30">30 mg</button><button type="button" class="opt" data-val="50">50 mg</button><button type="button" class="opt" data-val="100">100 mg</button><button type="button" class="opt" data-val="1000">1000 mg</button><button type="button" class="opt" data-val="custom">Custom</button><input class="opt-in" type="number" inputmode="decimal" min="0" step="any" placeholder="mg" aria-label="Size in mg" hidden></div></div>
      <div class="pc-field"><span class="pc-label">Doses</span>
        <div class="opts" data-new-how><button type="button" class="opt" data-how="same">Same as <span data-new-same></span></button><button type="button" class="opt" data-how="set">A dose</button><button type="button" class="opt" data-how="none">None yet</button></div>
        <div class="pl-new__dose" data-new-dose-row hidden><input class="opt-in" type="number" inputmode="decimal" min="0" step="any" placeholder="mg" data-new-dose aria-label="Dose in mg"><div class="opts" data-new-every><button type="button" class="opt" data-val="1">Daily</button><button type="button" class="opt" data-val="2">Every other day</button><button type="button" class="opt" data-val="7">Weekly</button></div></div>
      </div>
      <div class="pl-dates pc-field"><span class="pc-label">Start → end</span><div class="pl-dates__row"><input type="date" data-new-start aria-label="Start: the first dose"><span class="pl-dates__to" aria-hidden="true">→</span><input type="date" data-new-end aria-label="End: the last day it's used"><button type="button" class="pl-auto" data-new-end-auto hidden>Auto</button></div><small class="pl-dates__hint" data-new-hint></small></div>
      <div class="pc-acts"><button type="button" class="pc-btn pc-btn--primary" data-new-ok>Add vial</button><button type="button" class="pc-btn" data-new-x>Cancel</button></div>
    </div>
    <datalist id="pl-names"></datalist>
    <div class="pc-hidden" data-pl-all hidden><div data-pl-all-list></div></div>
  </section>

  <section class="pc-card pc-cal cal" data-cal aria-label="Calendar">
    <header class="pc-cal__head">
      <h2 class="pc-cal__title" data-cal-title>&nbsp;</h2>
      <div class="pc-cal__tools">
        <div class="pc-seg" role="group" aria-label="Months shown"><button type="button" data-cal-span="1" aria-pressed="true">Month</button><button type="button" data-cal-span="3" aria-pressed="false">3 months</button></div>
        <div class="pc-nav"><button type="button" class="pc-icon" data-cal-nav="-1" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><button type="button" class="pc-btn pc-btn--sm" data-cal-today>Today</button><button type="button" class="pc-icon" data-cal-nav="1" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
        <button type="button" class="pc-icon pc-look" data-cal-look title="Light or dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="pc-hidden">Dark</span></button>
      </div>
    </header>
    <div class="cal__months" data-cal-months></div>
    <footer class="pc-cal__foot"><span data-cal-sum>&nbsp;</span><button type="button" class="pc-link cal__clear" data-cal-clear hidden>Clear plan</button></footer>
    <div class="cal__ed" data-cal-ed hidden><div class="cal__ed-in"><div class="cal__ed-box" role="group" aria-label="Dose for this day">
      <div class="ed__head"><b data-ed-date></b><span class="ed__meta" data-ed-meta></span><button type="button" class="pc-icon ed__x" data-ed-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="ed__row" data-ed-vial-row hidden><span class="ed__k">Vial</span><div class="opts" data-ed-vials></div></div>
      <div class="ed__row"><span class="ed__k">Dose</span><div class="opts" data-ed-dose><button type="button" class="opt" data-val="0.5">0.5 mg</button><button type="button" class="opt" data-val="1">1 mg</button><button type="button" class="opt" data-val="2">2 mg</button><button type="button" class="opt" data-val="2.5">2.5 mg</button><button type="button" class="opt" data-val="3">3 mg</button><button type="button" class="opt" data-val="5">5 mg</button><button type="button" class="opt" data-val="10">10 mg</button><button type="button" class="opt" data-val="custom">Custom</button><input class="opt-in" type="number" inputmode="decimal" min="0" step="any" placeholder="mg" aria-label="Dose in mg" hidden><button type="button" class="opt" data-val="0">None</button><button type="button" class="opt opt--stop" data-ed-stop>Stop here</button></div></div>
      <div class="ed__row"><span class="ed__k">Repeat</span><div class="opts" data-ed-rep><button type="button" class="opt is-active" data-val="0">Just this day</button><button type="button" class="opt" data-val="1">Daily</button><button type="button" class="opt" data-val="2">Every other day</button><button type="button" class="opt" data-val="7">Weekly</button></div></div>
      <p class="ed__hint" data-ed-hint hidden></p>
    </div></div></div>
  </section>

  <section class="pc-card pc-vial pl-out" aria-label="The vial picked">
    <header class="pc-head pc-vial__head">
      <i class="pc-dot" aria-hidden="true"></i>
      <div class="pc-vial__name" data-pl-set-sum>&nbsp;</div>
      <button type="button" class="pc-btn pc-btn--sm pl-set__go" data-pl-set-toggle aria-expanded="false" aria-controls="pl-set-body"><span data-pl-set-word>Edit vial</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <b class="pc-hidden" data-pl-size></b>
    </header>
    <div class="pl-set pc-set" data-pl-set>
      <div class="pl-set__body pc-set__body" id="pl-set-body" data-pl-set-body hidden>
        <label class="pc-field"><span class="pc-label">Name</span><input type="text" class="pc-input" data-pl-name maxlength="28" placeholder="e.g. BPC-157" list="pl-names" autocomplete="off" spellcheck="false"></label>
        <div class="pc-field"><span class="pc-label">Color</span><div class="pl-swatches" data-pl-colors><button type="button" class="pl-sw" data-c="0" data-color="0" aria-label="Green"></button><button type="button" class="pl-sw" data-c="1" data-color="1" aria-label="Blue"></button><button type="button" class="pl-sw" data-c="2" data-color="2" aria-label="Violet"></button><button type="button" class="pl-sw" data-c="3" data-color="3" aria-label="Pink"></button><button type="button" class="pl-sw" data-c="4" data-color="4" aria-label="Lime"></button><button type="button" class="pl-sw" data-c="5" data-color="5" aria-label="Silver"></button><button type="button" class="pl-sw pl-sw--custom" data-pl-custom-open aria-label="Custom color" aria-expanded="false" aria-controls="pl-cpick"></button></div></div>
        <div class="pl-cpick pc-field" id="pl-cpick" data-pl-cpick role="group" aria-label="Custom color" hidden><span class="pc-label">Custom color</span><div class="pl-cpick__row"><input type="color" data-pl-custom value="#33e6b0" aria-label="Pick a color"><input type="text" class="pc-input pl-cpick__hex" data-pl-hex maxlength="7" autocomplete="off" spellcheck="false" aria-label="Color code, like #33e6b0"><button type="button" class="pc-btn pc-btn--primary pl-cpick__ok" data-pl-cpick-ok>Apply</button><button type="button" class="pc-btn" data-pl-cpick-x>Cancel</button></div></div>
        <div class="pc-field"><span class="pc-label">Size</span><div class="opts" data-pl-vial><button type="button" class="opt" data-val="2">2 mg</button><button type="button" class="opt is-active" data-val="5">5 mg</button><button type="button" class="opt" data-val="10">10 mg</button><button type="button" class="opt" data-val="15">15 mg</button><button type="button" class="opt" data-val="20">20 mg</button><button type="button" class="opt" data-val="30">30 mg</button><button type="button" class="opt" data-val="50">50 mg</button><button type="button" class="opt" data-val="100">100 mg</button><button type="button" class="opt" data-val="1000">1000 mg</button><button type="button" class="opt" data-val="custom">Custom</button><input class="opt-in" type="number" inputmode="decimal" min="0" step="any" placeholder="mg" aria-label="Size in mg" hidden></div></div>
        <div class="pl-dates pc-field"><span class="pc-label">Start → end</span><div class="pl-dates__row"><input type="date" data-pl-start aria-label="Start: the first dose"><span class="pl-dates__to" aria-hidden="true">→</span><input type="date" data-pl-end aria-label="End: the last day it's used"><button type="button" class="pl-auto" data-pl-end-auto hidden>Auto</button></div><small class="pl-dates__hint" data-pl-hint></small></div>
        <button type="button" class="pc-link pc-link--danger pl-remove" data-pl-remove hidden>Remove vial</button>
      </div>
    </div>
    <div class="pc-stats"><div class="pc-stat" data-pl-t="day"><span class="pc-stat__k" data-pl-d>&nbsp;</span><span class="pc-stat__v"><b data-pl-v>0</b> mg</span><span class="pc-stat__bar" aria-hidden="true"><i></i></span><span class="pc-stat__u" data-pl-u>Nothing used</span></div><div class="pc-stat" data-pl-t="week"><span class="pc-stat__k" data-pl-d>&nbsp;</span><span class="pc-stat__v"><b data-pl-v>0</b> mg</span><span class="pc-stat__bar" aria-hidden="true"><i></i></span><span class="pc-stat__u" data-pl-u>Nothing used</span></div><div class="pc-stat" data-pl-t="month"><span class="pc-stat__k" data-pl-d>&nbsp;</span><span class="pc-stat__v"><b data-pl-v>0</b> mg</span><span class="pc-stat__bar" aria-hidden="true"><i></i></span><span class="pc-stat__u" data-pl-u>Nothing used</span></div></div>
    <dl class="pc-rows">
      <div><dt data-pl-out-k>Runs dry</dt><dd data-pl-out>—</dd></div>
      <div><dt>Planned</dt><dd data-pl-plan>No doses yet</dd></div>
    </dl>
    <p class="pc-warn warn" data-pl-warn hidden></p>
  </section>
</div>
<script src="assets/js/search-index.js?v=1794300261"></script>
<script src="assets/js/v2-planner.js?v=1794300261" defer></script>
</body>
</html>
